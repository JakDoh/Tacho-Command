name: Cloudflare production deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed main commit SHA to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tachocommand-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing tachocommand Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out approved main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor HEAD origin/main

      - name: Validate source
        run: |
          npm run typecheck
          npm run lint

      - name: Build production artifact
        run: npm run build:cloudflare

      - name: Test the built candidate
        run: node --test tests/*.test.mjs

      - name: Verify locked production target
        run: >-
          node -e "const c=require('./dist/server/wrangler.json');
          const db=c.d1_databases?.filter(x=>x.binding==='DB')??[];
          if(c.name!=='tachocommand'||db.length!==1||db[0].database_name!=='tachocommand-prod'||db[0].database_id!=='0796463f-28ee-485a-8cc4-40b213e7ae26')
          process.exit(1);"

      - name: Show pending production database migrations
        run: npx wrangler d1 migrations list tachocommand-prod --remote --config wrangler.jsonc

      - name: Apply versioned production database migrations
        run: npx wrangler d1 migrations apply tachocommand-prod --remote --config wrangler.jsonc

      - name: Deploy existing production Worker
        run: npx wrangler deploy --config dist/server/wrangler.json

name: Isolated audit preview
on:
  push:
    branches: [audit/hardening-20260928]
permissions:
  contents: read
concurrency:
  group: tachocommand-audit-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:cloudflare
      - run: node --test tests/*.test.mjs
      - name: Create isolated target without databases, cron, routes or application secrets
        run: node scripts/prepare-audit-preview.mjs
      - name: Deploy audit Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/audit-preview.json
